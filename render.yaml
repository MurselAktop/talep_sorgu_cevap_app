# Render Blueprint - TSYS
# Dashboard: New -> Blueprint -> select this repo
# Or sync existing Blueprint after pushing this file.
#
# Not: Static Site (tsys-web) çalışma zamanında Redis'e bağlanamaz.
# Redis (Key Value) aynı Render workspace + bölgede bir Web Service /
# Background Worker ile kullanılır (REDIS_URL fromService).

services:
  - type: web
    name: tsys-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run generate
    staticPublishPath: ./web/.output/public
    buildFilter:
      paths:
        - web/**
    routes:
      # SPA fallback for dynamic client routes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NUXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NUXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # Redis-uyumlu Valkey (Render Key Value) — performans / önbellek katmanı
  - type: keyvalue
    name: tsys-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    # [] = yalnızca aynı bölgedeki Render servisleri (internal URL)
    ipAllowList: []
