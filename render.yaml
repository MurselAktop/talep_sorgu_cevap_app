# Render Blueprint - TSYS
# Dashboard: New -> Blueprint -> select this repo
# Or sync existing Blueprint after pushing this file.
#
# tsys-web  = Nuxt Static Site (istemci; Redis yok)
# tsys-redis = Key Value (internal)
# tsys-api  = Node cache API (Redis + Supabase JWT)

services:
  - type: web
    name: tsys-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run generate
    staticPublishPath: ./web/.output/public
    buildFilter:
      paths:
        - web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NUXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NUXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NUXT_PUBLIC_CACHE_API_URL
        sync: false

  - type: keyvalue
    name: tsys-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: tsys-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: REDIS_URL
        fromService:
          name: tsys-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: tsys-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: tsys-redis
          type: keyvalue
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STATS_CACHE_TTL_SECONDS
        value: "60"
